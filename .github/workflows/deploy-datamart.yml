name: Desplegar data mart (Liquibase a Databricks)

on:
  push:
    branches: [main]
    paths:
      - "liquibase/**"
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: liquibase/pom.xml

      - name: Aplicar changelogs en Databricks con Liquibase
        working-directory: liquibase
        env:
          DATABRICKS_JDBC_URL: ${{ secrets.DATABRICKS_JDBC_URL }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          mvn -B -e liquibase:update \
            -Dliquibase.url="${DATABRICKS_JDBC_URL}" \
            -Dliquibase.username=token \
            -Dliquibase.password="${DATABRICKS_TOKEN}"

      - name: Verificar secretos
        env:
          URL: ${{ secrets.DATABRICKS_JDBC_URL }}
          TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          [ -n "$URL" ] && echo "URL: OK" || echo "URL: VACIA"
          [ -n "$TOKEN" ] && echo "TOKEN: OK" || echo "TOKEN: VACIO"